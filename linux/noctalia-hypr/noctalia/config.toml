[accessibility]
ui_scale = 1

[bar.default]
border = "#FFFFFF"
capsule = true
capsule_group = []
capsule_opacity = 0.40000000000000002
capsule_radius = 8
center = [ "media", "temp", "sysmon_2", "sysmon_3", "tray" ]
concave_edge_corners = true
contact_shadow = true
end = [ "notifications", "network", "volume", "clock", "session", "battery" ]
font_family = "JetBrains Mono Light"
margin_edge = 8
margin_ends = 8
margin_opposite_edge = 8
padding = 12
radius = 0
radius_bottom_left = 0
radius_bottom_right = 0
radius_top_left = 0
radius_top_right = 0
scale = 1
start = [ "launcher", "workspaces" ]
thickness = 36
widget_spacing = 12

[battery.device."/org/freedesktop/UPower/devices/mouse_dev_D4_34_30_C7_45_07"]
warning_threshold = 10

[control_center]
sidebar = "full"
sidebar_section = "full"

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000002", "desktop-widget-0000000000000003", "desktop-widget-0000000000000004" ]

    [desktop_widgets.grid]
    cell_size = 8
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000002]
    box_height = 744.0
    box_width = 920.0
    cx = 960.0
    cy = 600.0
    output = "eDP-1"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "fancy_audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000002.settings]
        background = false

    [desktop_widgets.widget.desktop-widget-0000000000000003]
    box_height = 0.0
    box_width = 0.0
    cx = 960.0
    cy = 824.0
    output = "eDP-1"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "media_player"

    [desktop_widgets.widget.desktop-widget-0000000000000004]
    box_height = 0.0
    box_width = 0.0
    cx = 968.0
    cy = 359.20001220703125
    output = "eDP-1"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "weather"

[lockscreen]
blur_intensity = 1

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 927.0
    output = "eDP-1"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = []

[shell]
clipboard_image_action_command = "satty -f -"
external_ip_enabled = true
launch_apps_as_systemd_services = true
polkit_agent = true
settings_show_advanced = false

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    app_grid = true
    sort_by_usage = false

    [shell.panel]
    launcher_placement = "attached"
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"

    [shell.screenshot]
    copy_to_clipboard = false
    pipe_command = "satty -f -"
    pipe_to_command = true
    save_to_file = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[system.monitor]
gpu_poll_seconds = 2

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "soft"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk3", "gtk4", "ghostty", "hyprland", "kcolorscheme", "kitty", "qt" ]

[wallpaper.default]
path = "/home/fabs/Pictures/Wallpapers/Under_Starlit_Sky.png"

[wallpaper.last]
path = "/home/fabs/Pictures/Wallpapers/Under_Starlit_Sky.png"

[wallpaper.monitors.eDP-1]
path = "/home/fabs/Pictures/Wallpapers/Under_Starlit_Sky.png"

[widget.battery]
display_mode = "graphic"
hide_when_full = true
hide_when_plugged = true

[widget.clock]
color = "secondary"
format = "{:%H:%M %A %m/%d/%y}"

[widget.launcher]
color = "secondary"
glyph = "skull"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
color = "secondary"

[widget.notifications]
color = "secondary"

[widget.session]
color = "secondary"

[widget.sysmon_2]
glyph = "gpu-usage"
show_value = false
stat = "gpu_temp"
type = "sysmon"

[widget.sysmon_3]
glyph = "cpu-2"
stat = "ram_used"
type = "sysmon"

[widget.temp]
show_value = true

[widget.tray]
capsule = true
capsule_fill = "secondary"

[widget.volume]
color = "secondary"

[widget.workspaces]
active_pill_size = 0.80000000000000004
capsule = true
capsule_fill = "secondary"
inactive_pill_size = 1.0
pill_scale = 1
show_labels = false


# Tmux Configuration
# Generated with TmuxAI Config Generator
# https://tmuxai.dev

# -- Basic Settings ------------------------------------------
set -g prefix C-b
set -g escape-time 500
set -g history-limit 5000
set -g base-index 1
setw -g pane-base-index 1
set -g mouse on

# -- Key Bindings ------------------------------------------
# Window management
bind n new-window
bind r command-prompt -I "#W" "rename-window '%%'"
bind l choose-window
bind q confirm-before -p "kill-window #W? (y/n)" kill-window

# -- Status Bar ---------------------------------------------
set -g status-position top
set -g status-interval 5
set -g status-left-length 60
set -g status-right-length 150

set -g @minimal-tmux-status "top"

# Session name + git branch of the active pane's cwd
set -g @minimal-tmux-status-left-extra "#(pwd 2>/dev/null; git branch --show-current 2>/dev/null | sed 's/^/ (/;s/$/)/')"

# CPU / battery / date / hostname
set -g @minimal-tmux-status-right-extra " | #{battery_percentage} |  %d/%m %H:%M "

# -- Plugins -----------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'niksingh710/minimal-tmux-status'
set -g @plugin 'tmux-plugins/tmux-battery'

run '~/.tmux/plugins/tpm/tpm'



# Tmux Configuration
# Generated with TmuxAI Config Generator
# https://tmuxai.dev

# -- Basic Settings ------------------------------------------
set -g prefix C-b
set -g escape-time 500
set -g history-limit 5000
set -g base-index 1
setw -g pane-base-index 1
set -g mouse on

# -- Key Bindings ------------------------------------------
# Window management
bind n new-window
bind r command-prompt -I "#W" "rename-window '%%'"
bind l choose-window
bind q confirm-before -p "kill-window #W? (y/n)" kill-window

# -- Status Bar ---------------------------------------------
set -g status-position top
set -g status-interval 5
set -g status-left-length 60
set -g status-right-length 150

# Noctalia LoFi palette
set -g status-style "bg=#1c1c21,fg=#f2f2f3"
set -g message-style "bg=#988fa3,fg=#1c1c22"
set -g message-command-style "bg=#988fa3,fg=#1c1c22"
set -g pane-border-style "fg=#2f2f37"
set -g pane-active-border-style "fg=#989ab3"
set -g display-panes-colour "#2f2f37"
set -g display-panes-active-colour "#989ab3"
set -g window-status-style "bg=#1c1c21,fg=#b0b0b5"
set -g window-status-separator " "
set -g clock-mode-colour "#b6b7c9"
set -g mode-style "bg=#918da5,fg=#1c1c22,bold"

set -g @minimal-tmux-status "top"
set -g @minimal-tmux-bg "#989ab3"
set -g @minimal-tmux-fg "#1c1c22"
set -g @minimal-tmux-window-status-format " #I:#{?#{m:ssh*,#{pane_current_command}},#(ps -t #{pane_tty} -o args= | grep \"^ssh \" | sed \"s/.* //\"),#W} "

# Session name + git branch of the active pane's cwd
set -g @minimal-tmux-status-left-extra "#(pwd 2>/dev/null; git branch --show-current 2>/dev/null | sed 's/^/ (/;s/$/)/')"

# CPU / battery / date / hostname
set -g @minimal-tmux-status-right-extra " | #{battery_percentage} |  %d/%m %H:%M "

# -- Plugins -----------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'niksingh710/minimal-tmux-status'
set -g @plugin 'tmux-plugins/tmux-battery'

run '~/.tmux/plugins/tpm/tpm'
